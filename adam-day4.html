<title>أصدقاء من حول العالم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: one 16:9 classroom-board stage, Adam stands on the right edge of every slide, cards sit on a cork-and-paper board */
:root{
  --sky:#2f8fd6; --sky-soft:#e3f1fb;
  --leaf:#3f9a5c; --leaf-soft:#e5f4e8;
  --sun:#f5b324; --sun-soft:#fff3d4;
  --rose:#e2577a; --rose-soft:#fde6ec;
  --plum:#7b5bc4; --plum-soft:#efe9fb;
  --paper:#fffdf8; --board:#f3ecdf; --ink:#26303b; --muted:#5f6b78; --line:#e3d9c8;
  --wood:#b07a45;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky-soft:#17324a; --leaf-soft:#173a24; --sun-soft:#3d3011; --rose-soft:#43202b; --plum-soft:#2c2347;
  --paper:#1f2630; --board:#151b22; --ink:#eef2f6; --muted:#a9b4c0; --line:#324050; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky-soft:#17324a; --leaf-soft:#173a24; --sun-soft:#3d3011; --rose-soft:#43202b; --plum-soft:#2c2347;
  --paper:#1f2630; --board:#151b22; --ink:#eef2f6; --muted:#a9b4c0; --line:#324050; color-scheme:dark}
html,body{height:100%}
body{background:var(--board);color:var(--ink);font-family:var(--body);direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1{font-family:var(--display);font-size:1.15rem;margin:0;flex:1;min-width:0}
.topbar small{color:var(--muted);font-weight:500}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 10px;font:600 .78rem var(--body);cursor:pointer}
.dot[aria-current="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
.dot:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.stage{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:var(--paper);
  border:6px solid var(--wood);box-shadow:0 10px 30px rgba(60,40,20,.18);container-type:inline-size}
.slide{position:absolute;inset:0;display:none;padding:2.2cqw 2.4cqw;gap:1.4cqw}
.slide.on{display:grid;animation:in .45s ease}
@keyframes in{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}

/* content slide grid: content left (visually), Adam right */
.slide.content{grid-template-columns:1fr 21cqw;grid-template-rows:auto 1fr}
.head{grid-column:1/-1;display:flex;align-items:center;gap:1.2cqw}
.pill{font:700 1.3cqw var(--body);padding:.5cqw 1.3cqw;border-radius:999px;color:#fff;white-space:nowrap}
.head h2{font-family:var(--display);font-weight:800;font-size:3.3cqw;margin:0;line-height:1.1;text-wrap:balance}
.head .num{font-family:var(--display);font-size:2cqw;color:var(--muted);margin-inline-start:auto}
.cards{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:min-content;gap:1cqw;align-content:start;min-width:0}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:1.2cqw;padding:1cqw 1.2cqw;min-width:0}
.card h3{margin:0 0 .4cqw;font:700 1.35cqw var(--body)}
.card p,.card li{margin:0;font-size:1.35cqw;line-height:1.55}
.card ul{margin:0;padding-inline-start:1.4cqw}
.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}.span2{grid-column:span 2}
.concept{display:flex;align-items:center;gap:1cqw;border:none}
.concept .scale{font-size:2.6cqw;line-height:1}
.concept b{font-family:var(--display);font-size:1.6cqw}
.verse{font-family:"Amiri","Traditional Arabic",serif;font-size:1.7cqw}

.adam-col{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.8cqw;min-width:0}
.bubble{position:relative;background:var(--paper);border:2px solid var(--sky);border-radius:1.4cqw;padding:.9cqw 1.1cqw;font:700 1.35cqw/1.5 var(--body);text-align:center;width:100%}
.bubble::after{content:"";position:absolute;bottom:-1.1cqw;left:50%;width:1.6cqw;height:1.6cqw;background:var(--paper);border-left:2px solid var(--sky);border-bottom:2px solid var(--sky);transform:translateX(-50%) rotate(-45deg)}
.speak{margin-top:.5cqw;border:none;background:var(--sky);color:#fff;border-radius:999px;font:700 1.1cqw var(--body);padding:.35cqw 1cqw;cursor:pointer}
.adam{position:relative;width:16cqw;aspect-ratio:270/457;border-radius:1.6cqw;overflow:hidden;box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.18);animation:bob 3.2s ease-in-out infinite}
.adam img{width:100%;height:100%;display:block}
.adam .mouth{position:absolute;left:45.5%;top:26.9%;width:12%;height:3.6%;background-image:var(--adam);background-size:833.3% 2777.8%;background-position:51.7% 27.9%;transform-origin:50% 0;opacity:0}
.talking .mouth{opacity:1;animation:jaw .22s ease-in-out infinite alternate}
@keyframes jaw{from{transform:scaleY(1)}to{transform:scaleY(1.9)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.5cqw) rotate(-1deg)}}
.scene{font:700 1.15cqw var(--body);color:var(--sky);text-decoration:none;border:1.5px dashed var(--sky);border-radius:999px;padding:.3cqw 1cqw;white-space:nowrap}

/* zones */
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:1cqw;min-width:0;align-content:start}
.zone{border-radius:1.2cqw;padding:1cqw;background:var(--paper);border:1.5px solid var(--line);min-width:0}
.zone .ic{font-size:2.6cqw;line-height:1}
.zone h3{margin:.4cqw 0 .2cqw;font:800 1.45cqw var(--display)}
.zone p{margin:0;font-size:1.3cqw;line-height:1.5}

/* intro */
.slide.intro{grid-template-columns:1fr;padding:0;background:#000}
.intro .bg{position:absolute;inset:0;background:var(--bgimg) center/cover;filter:blur(6px) brightness(.55);transform:scale(1.06)}
.intro .wrap{position:relative;display:grid;grid-template-columns:1fr 26cqw;align-items:end;gap:2cqw;padding:3cqw 4cqw}
.intro .adam{width:24cqw;border:.5cqw solid #fff}
.intro .title{position:absolute;top:2.6cqw;right:4cqw;left:4cqw;text-align:center;color:#fff;font:800 4cqw var(--display);text-shadow:0 .3cqw 1cqw rgba(0,0,0,.4)}
.intro .title small{display:block;font:500 1.6cqw var(--body);opacity:.9}
.say{align-self:center;background:#fffdf8;color:#26303b;border-radius:2cqw;padding:2cqw 2.4cqw;font:800 2.9cqw/1.5 var(--display);min-height:13cqw;position:relative;box-shadow:0 1cqw 3cqw rgba(0,0,0,.35)}
.say::after{content:"";position:absolute;left:-1.4cqw;bottom:3cqw;border:1.4cqw solid transparent;border-right-color:#fffdf8;border-left:0}
.controls{position:absolute;bottom:2cqw;left:4cqw;display:flex;gap:1cqw}
.btn{border:none;border-radius:999px;font:700 1.5cqw var(--body);padding:.8cqw 2cqw;cursor:pointer;background:var(--sun);color:#3a2a00}
.btn.alt{background:#fff;color:#26303b}
.progress{position:absolute;bottom:0;right:0;height:.5cqw;background:var(--sun);width:0;transition:width .3s}
.flags{position:absolute;top:9.5cqw;right:4cqw;left:30cqw;display:flex;gap:1.2cqw;justify-content:center;flex-wrap:wrap}
.flags span{background:rgba(255,255,255,.92);color:#26303b;border-radius:999px;padding:.4cqw 1.2cqw;font:700 1.5cqw var(--body);animation:pop .6s backwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}

.nav{display:flex;justify-content:space-between;gap:10px}
.nav .btn{font-size:.95rem;padding:8px 18px}
.note{color:var(--muted);font-size:.85rem;margin:0}

@media (max-width:640px){.topbar h1{font-size:1rem}}
@media (prefers-reduced-motion:reduce){.adam,.slide.on,.flags span{animation:none}.talking .mouth{animation:none}}
</style>

const NAMES=['🎬 آدم يرحّب','اللقاء الصباحي','المراكز: النشاط الرئيس','الأركان','الوجبة','الحرف والعدد','الملعب','القراءة الجهرية','المنزل','اللقاء الختامي','بطاقة اليوم'];

const stage=document.getElementById('stage'),dots=document.getElementById('dots');
const adamHTML=()=>`<div class="adam"><img src="${ADAM}" alt="آدم بالشماغ والثوب يحمل جواز سفره"><span class="mouth" aria-hidden="true"></span></div>`;

/* intro slide */
let html=`<section class="slide intro" data-i="0"><div class="bg"></div>
 <div class="title">أصدقاء من حول العالم<small>آدم يرحّب بكم قبل الحلقة</small></div>
 <div class="flags" id="flags"></div>
 <div class="wrap"><div class="say" id="say" aria-live="polite">اضغطوا «ابدأ» ليتكلم آدم 🎬</div>${adamHTML()}</div>
 <div class="controls"><button class="btn" id="play" type="button">▶ ابدأ</button><button class="btn alt" id="toCircle" type="button">إلى الحلقة ←</button></div>
 <div class="progress" id="prog"></div></section>`;
S.forEach((s,k)=>{
  const col=C[s.color];
  const body=s.zones
   ? `<div class="zones">${s.zones.map(z=>`<div class="zone"><div class="ic">${z[0]}</div><h3>${z[1]}</h3><p>${z[2]}</p></div>`).join('')}</div>`
   : `<div class="cards"><div class="card concept span6" style="background:var(--${s.color}-soft)"><span class="scale">⚖️</span><div><b>مفهوم اليوم: الإنصاف</b><p>${s.concept}</p></div></div>${s.cards.map(c=>`<div class="card ${c[0]}"><h3 style="color:${col}">${c[1]}</h3>${c[2]}</div>`).join('')}</div>`;
  html+=`<section class="slide content" data-i="${k+1}">
   <div class="head"><span class="pill" style="background:${col}">${s.pill}</span><h2>${s.title}</h2><span class="num">${k+1} / ${S.length}</span></div>
   ${body}
   <div class="adam-col"><div class="bubble">${s.say}<br><button class="speak" type="button" data-say="${k}">🔊 آدم يتكلم</button></div>${adamHTML()}${s.scene?`<a class="scene" href="${s.scene}" target="_blank" rel="noopener">🖼️ مشهد الصف</a>`:''}</div></section>`;
});
stage.innerHTML=html;
NAMES.forEach((n,i)=>{const b=document.createElement('button');b.className='dot';b.type='button';b.textContent=n;b.onclick=()=>go(i);dots.appendChild(b)});

let cur=0;const slides=[...stage.querySelectorAll('.slide')];
function go(i){stopTalk();cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('on',j===cur));
  [...dots.children].forEach((d,j)=>d.setAttribute('aria-current',j===cur));}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur+1);if(e.key==='ArrowRight')go(cur-1)});

/* speech */
const synth=window.speechSynthesis;let arVoice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();arVoice=v.find(x=>/^ar/i.test(x.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
const clean=t=>t.replace(/<[^>]+>/g,'').replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,'');
function speak(text,el,done){
  el&&el.classList.add('talking');
  const fin=()=>{el&&el.classList.remove('talking');done&&done()};
  if(!synth||!arVoice){setTimeout(fin,Math.max(2200,clean(text).length*85));return}
  const u=new SpeechSynthesisUtterance(clean(text));u.voice=arVoice;u.lang=arVoice.lang;u.pitch=1.6;u.rate=.92;
  u.onend=fin;u.onerror=fin;synth.speak(u);
}
let talkToken=0;
function stopTalk(){talkToken++;synth&&synth.cancel();stage.querySelectorAll('.talking').forEach(e=>e.classList.remove('talking'))}
stage.addEventListener('click',e=>{const b=e.target.closest('.speak');if(!b)return;stopTalk();
  speak(S[+b.dataset.say].say,b.closest('.adam-col').querySelector('.adam'))});

const FL=['🇸🇦 السلام عليكم','🇬🇧 Hello','🇫🇷 Bonjour','🇪🇸 Hola','🇨🇳 你好','🇹🇷 Merhaba','🇵🇰 السلام علیکم'];
function runIntro(){
  stopTalk();const tok=talkToken,say=document.getElementById('say'),ad=slides[0].querySelector('.adam'),prog=document.getElementById('prog'),fl=document.getElementById('flags');
  fl.innerHTML='';let i=0;
  const step=()=>{if(tok!==talkToken)return;
    if(i>=INTRO.length){prog.style.width='100%';setTimeout(()=>{if(tok===talkToken)go(1)},1600);return}
    say.textContent=INTRO[i];prog.style.width=((i+1)/INTRO.length*100)+'%';
    if(i===5)FL.forEach((f,j)=>{const s=document.createElement('span');s.textContent=f;s.style.animationDelay=j*.15+'s';fl.appendChild(s)});
    i++;speak(INTRO[i-1],ad,()=>setTimeout(step,450));};
  step();
}
document.getElementById('play').onclick=runIntro;
document.getElementById('toCircle').onclick=()=>go(1);
go(0);
</script>
